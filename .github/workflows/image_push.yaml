name: Docker Image push
on:
  push:
    branches:
    - main
    - feature/*
    paths:
    - .github/workflows/** 
    - migrations/**
    - docker-compose.yaml

jobs:
    Build:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v7
        - name: Generate Image Tag
          run: |
            echo "image_tag=danishreg/flaskapp:${{ job.check_run_id }}" >> $GITHUB_ENV
        - name: docker_login
          uses: docker/login-action@v4
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
        - name: build_image
          uses: docker/build-push-action@v7
          with:
            context: .
            push: false
            tags: ${{ env.image_tag }}
        - name: deploying_app
          run: docker compose up -d
        - name: smoke test
          run: |
            sleep 5
            curl -si localhost:5000 | grep ^HTTP | awk '{print $2}'
            echo "status_code=$(curl -si localhost:5000 | grep ^HTTP | awk '{print $2}')" >> $GITHUB_ENV
        - name: pushing image
          if: ${{ env.status_code == '200' }}
          run: |
            docker push $image_tag
        - name: logs
          if: ${{ always() }}
          run: |
            docker ps
            docker images
            docker logs flask_app